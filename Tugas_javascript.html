  <script>

    let bogor = 2000;
    let depok = 4000;
    let kotaLain = 6000;

    let kotapaket = "jakarta";

    switch (kotapaket) {

        total = depok * berat
        console.log(total);
        break;
      case "bogor":
        total = bogor * berat
        console.log(total);
        break;
      default:

        console.log(total);
        break;
    }
